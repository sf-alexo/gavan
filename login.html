<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — мокап</title>
<link rel="stylesheet" href="styles.css">
<style>
.auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
.auth-card { width: 360px; }
.auth-card h1 { font-size: 22px; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="auth-page">
  <div class="card auth-card">
    <h1>Gavan CRM</h1>
    <p style="color:var(--muted); margin-top:0">Вход для сотрудников</p>
    <form>
      <label class="field"><span>Email</span>
        <input class="input" type="email" required>
      </label>
      <label class="field"><span>Пароль</span>
        <input class="input" type="password" required minlength="6">
      </label>
      <a class="btn primary" href="dashboard.html" style="display:block; text-align:center">Войти</a>
    </form>
  </div>
</div>
</body>
</html>

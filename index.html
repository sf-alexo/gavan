<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Чистая Гавань</title>
<link rel="stylesheet" href="styles.css">
<style>
.auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: flex-start; padding-left: 10%; box-sizing: border-box;
  background: url('images/Heroic Guardian of the Shining Harbor.webp') center/cover no-repeat, #0d1b3a; }
.auth-card { box-shadow: 0 18px 48px rgba(0,0,0,.35); }
.auth-card { width: 360px; }
.auth-card h1 { font-size: 22px; margin-bottom: 4px; }
@media (max-width: 640px) {
  .auth-page { padding: 16px 16px 48px; justify-content: center; align-items: flex-end;
    background-image: url('images/heroic-guardian-harbor-mobile.webp');
    background-position: center top; }
  .auth-card { width: 100%; max-width: 400px; }
  .auth-card .btn-row { flex-direction: column; }
  .auth-card .btn-row .btn { width: 100%; box-sizing: border-box; padding: 14px; font-size: 15px; }
}
</style>
</head>
<body>
<div class="auth-page">
  <div class="card auth-card">
    <h1>Чистая Гавань</h1>
    <p style="color:var(--muted); margin-top:0">Вход для сотрудников</p>
    <form>
      <label class="field"><span>Email</span>
        <input class="input" type="email" required>
      </label>
      <label class="field"><span>Пароль</span>
        <input class="input" type="password" required minlength="6">
      </label>
      <div class="btn-row" style="display:flex; gap:10px">
        <a class="btn primary" href="dashboard.html" style="flex:1; text-align:center">Я менеджер</a>
        <a class="btn" href="calendar.html" style="flex:1; text-align:center">Я сотрудник</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
